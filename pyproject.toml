[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netrecon"
version = "0.1.0"
description = "Evidence-aware analysis and comparison of Nmap XML scans."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Deeb Mzareb" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.scripts]
netrecon = "netrecon:main"

[tool.setuptools]
py-modules = [
    "analysis_diff",
    "analysis_summary",
    "analyzer",
    "findings",
    "host_summary",
    "models",
    "netrecon",
    "network_summary",
    "nse_rules",
    "parser",
    "reporter",
    "scan_diff",
    "service_rules",
]
